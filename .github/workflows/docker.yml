name: CD & Publish Image

on:
  push:
    tags:
      - "v*.*.*" 

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build backend & frontend, push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # required for pushing to ghcr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Backend image ---
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags:
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:backend-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:backend-latest
          labels:
            org.opencontainers.image.title=receipt-tracker-backend
            org.opencontainers.image.description=Receipt tracking API service
            org.opencontainers.image.version=${{ github.sha }}

      # --- Frontend image ---
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags:
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:frontend-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:frontend-latest
          labels:
            org.opencontainers.image.title=receipt-tracker-frontend
            org.opencontainers.image.description=Receipt tracking UI
            org.opencontainers.image.version=${{ github.sha }}